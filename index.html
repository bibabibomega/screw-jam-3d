<script>

const COLORS = {R:0xFF5E57, B:0x3867D6, Y:0xFFA801, G:0x05C46B, P:0x8854D0};
function mirror(d, order){           // lật gương theo trục dọc để có màn mới từ cùng bố cục

    plates:d.plates.map(p => Object.assign({}, p, {x:-p.x, a:-p.a})),
    screws:d.screws.map(s => Object.assign({}, s, {t:-s.t}))};

const L2 = {   // 9 ốc, 3 màu, 4 thanh, 1 ốc xuyên 2 thanh
  order:['Y','R','B'],
  plates:[
    {id:'A',x:0.5,y:-1.8,w:9.4,h:1.6,a:0,l:0,m:'wood'},
    {id:'B',x:-0.5,y:-0.7,w:8,h:1.4,a:-12,l:1,m:'silver'},
    {id:'C',x:0.6,y:1.6,w:7.2,h:1.4,a:10,l:2,m:'steel'},
    {id:'D',x:0,y:2.2,w:5.6,h:1.3,a:-8,l:3,m:'wood'}],
  screws:[
    {p:'D',t:-2.2,c:'Y'},{p:'D',t:2.2,c:'R'},
    {p:'C',t:-3.0,c:'B'},{p:'C',t:1.5,c:'Y'},{p:'C',t:3.2,c:'R'},
    {p:'B',t:-3.0,c:'B'},{p:'B',t:3.0,s:-0.25,c:'Y',also:['A']},
    {p:'A',t:-4.0,c:'R'},{p:'A',t:4.2,c:'B'}]
};
const L3 = {   // 12 ốc, 4 màu, 5 thanh đan chéo, 4 ốc xuyên 2 thanh
  order:['G','B','Y','R'],
  plates:[
    {id:'A',x:0,y:-3.4,w:9.6,h:1.4,a:-6,l:0,m:'silver'},
    {id:'B',x:0,y:-2.0,w:9.6,h:1.4,a:14,l:1,m:'wood'},
    {id:'C',x:0,y:-0.6,w:8.8,h:1.4,a:-14,l:2,m:'steel'},
    {id:'D',x:0,y:0.8,w:8.4,h:1.4,a:14,l:3,m:'wood'},
    {id:'E',x:0,y:2.2,w:7.6,h:1.3,a:-12,l:4,m:'silver'}],
  screws:[
    {p:'E',t:3.1,c:'R',also:['D']},{p:'E',t:-2.6,c:'Y'},{p:'E',t:0.2,c:'Y'},
    {p:'D',t:-2.89,c:'B',also:['C']},{p:'D',t:0.4,c:'G'},
    {p:'C',t:2.89,c:'G',also:['B']},{p:'C',t:-0.3,c:'R'},
    {p:'B',t:-4.07,c:'B',also:['A']},{p:'B',t:-1.2,c:'B'},{p:'B',t:3.4,c:'G'},
    {p:'A',t:3.8,c:'Y'},{p:'A',t:1.0,c:'R'}]

// Màu của L3 / L4 đã được bộ giải chọn để đúng độ khó: L3 cần >= 2 lỗ chờ, L4 (choke point) cần đủ 3 lỗ chờ
L3.order = ['G','B','Y','R'];
'B,Y,R,Y,B,R,Y,G,R,B,G,G'.split(',').forEach((c, i) => { L3.screws[i].c = c; });
const L4 = {   // cùng bố cục L3, lật gương
  order:['B','G','R','Y'],
  plates:L3.plates,
  screws:'Y,R,R,R,B,G,Y,B,G,B,Y,G'.split(',').map((c, i) => Object.assign({}, L3.screws[i], {c}))
};
const LEVELS = [   // 4 màn thủ công: dễ, dễ, trung bình, khó
  { // Level 1: 6 ốc, 2 màu, 3 thanh
    order:['R','B'],
    plates:[
      {id:'A',x:0,y:-2.6,w:9.2,h:1.5,a:0,l:0,m:'wood'},
      {id:'B',x:-0.8,y:0.2,w:7.6,h:1.4,a:12,l:1,m:'silver'},
      {id:'C',x:1.0,y:1.0,w:6.4,h:1.4,a:-10,l:2,m:'steel'}],
    screws:[
      {p:'C',t:-2.5,c:'R'},{p:'C',t:2.5,c:'B'},
      {p:'B',t:-3.0,c:'R'},{p:'B',t:2.6,c:'B'},
      {p:'A',t:-3.8,c:'R'},{p:'A',t:3.8,c:'B'}]
  },
  L2, L3, mirror(L4)
];
function inRect(p, x, y){            // điểm (x,y) có nằm trong hình chữ nhật đã xoay của thanh p không
  const dx = x - p.x, dy = y - p.y, c = Math.cos(p.ang), s = Math.sin(p.ang);
  const lx = dx*c + dy*s, ly = -dx*s + dy*c;
  return Math.abs(lx) <= p.w/2 && Math.abs(ly) <= p.h/2;
}
function resolveLevel(def){
  const plates = def.plates.map(p => ({id:p.id,x:p.x,y:p.y,w:p.w,h:p.h,ang:p.a*Math.PI/180,layer:p.l,mat:p.m}));
  const byId = {}; plates.forEach(p => byId[p.id] = p);
  const screws = def.screws.map(s => {
    const p = byId[s.p], c = Math.cos(p.ang), sn = Math.sin(p.ang), off = s.s || 0;
    const ids = [s.p].concat(s.also || []);
    return {x:p.x + s.t*c - off*sn, y:p.y + s.t*sn + off*c, color:s.c,
            plateIds:ids, layer:Math.max(...ids.map(i => byId[i].layer))};

}
/* Bộ giải: trả về danh sách chỉ số ốc cần tháo (theo thứ tự) hoặc null nếu không giải được với SLOTS lỗ chờ.
   Trạng thái: rem = mặt nạ ốc đã rời bàn (gồm cả ốc đang ở lỗ chờ), buf = mặt nạ ốc đang nằm ở lỗ chờ.
   Mô hình khớp luật game: ốc đúng màu hộp hiện tại bay thẳng vào hộp, ốc khác vào lỗ chờ;
   khi hộp đầy, hộp mới mở và ốc cùng màu trong lỗ chờ tự bay vào. */
/* Mô hình che khuất theo tư thế CUỐI CÙNG của thanh (không phụ thuộc người chơi thao tác thế nào):
   - còn >= 2 ốc giữ: thanh đứng yên ở tư thế ban đầu
   - còn đúng 1 ốc: thanh đung đưa rồi dừng khi tâm thanh nằm ngay dưới ốc đó (con lắc tắt dần), tối đa SWING_LIMIT
   - hết ốc: thanh rơi, không che nữa */
const SWING_LIMIT = 0.9;      // góc xoay tối đa (rad, ~52°) của thanh treo: bị khung/thanh khác chặn lại
function buildModel(L){
  const n = L.screws.length;
  const hold = {}; L.plates.forEach(p => { let m = 0; L.screws.forEach((s, i) => { if (s.plateIds.includes(p.id)) m |= 1 << i; }); hold[p.id] = m; });
  const pose = (p, k) => {             // tư thế cân bằng của thanh p khi chỉ còn ốc k giữ
    const s = L.screws[k], dx = s.x - p.x, dy = s.y - p.y, c = Math.cos(-p.ang), sn = Math.sin(-p.ang);
    const rx = dx*c - dy*sn, ry = dx*sn + dy*c, d = Math.hypot(rx, ry);
    if (d < 0.05) return p;
    let delta = Math.PI/2 - Math.atan2(ry, rx) - p.ang;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));                       // đưa về (-π, π]
    delta = Math.max(-SWING_LIMIT, Math.min(SWING_LIMIT, delta));
    const ang = p.ang + delta, ca = Math.cos(ang), sa = Math.sin(ang);
    return {x:s.x - (ca*rx - sa*ry), y:s.y - (sa*rx + ca*ry), ang, w:p.w, h:p.h};
  };
  const cover = L.screws.map(s => L.plates.filter(p => p.layer > s.layer).map(p => {
    const e = {mask:hold[p.id], init:inRect(p, s.x, s.y), piv:{}};
    for (let k = 0; k < n; k++) if ((e.mask >> k) & 1) e.piv[k] = inRect(pose(p, k), s.x, s.y);
    return e;
  }));
  return {n, hold, blocked(i, rem){
    for (const e of cover[i]) {
      const left = e.mask & ~rem; if (!left) continue;
      if (left & (left - 1)) { if (e.init) return true; }
      else if (e.piv[31 - Math.clz32(left)]) return true;
    }
    return false;
  }};
}
function solvePath(L, SLOTS, rem0, buf0, model){      // model: dựng từ tư thế BAN ĐẦU của thanh (trong game phải truyền state.model)
  rem0 = rem0 || 0; buf0 = buf0 || 0;
  model = model || buildModel(L); const blocked = model.blocked;
  const n = L.screws.length, full = (1 << n) - 1, order = L.order;
  const ci = L.screws.map(s => order.indexOf(s.color));
  const counts = (rem, buf) => { const c = new Array(order.length).fill(0), d = rem & ~buf; for (let k = 0; k < n; k++) if ((d >> k) & 1) c[ci[k]]++; return c; };
  function flush(rem, buf){
    for (;;) {
      const c = counts(rem, buf); let cur = 0; while (cur < order.length && c[cur] >= 3) cur++;
      if (cur >= order.length) return buf;
      let moved = false;
      for (let k = 0; k < n && c[cur] < 3; k++) if (((buf >> k) & 1) && ci[k] === cur) { buf &= ~(1 << k); c[cur]++; moved = true; }
      if (!moved) return buf;
    }
  }
  function apply(rem, buf, i){      // trả về [rem', buf'] hoặc null nếu không đi được
    const c = counts(rem, buf); let cur = 0; while (cur < order.length && c[cur] >= 3) cur++;
    const r2 = rem | (1 << i);
    if (ci[i] === cur) return [r2, flush(r2, buf)];
    let bc = 0; for (let k = 0; k < n; k++) if ((buf >> k) & 1) bc++;
    return bc >= SLOTS ? null : [r2, buf | (1 << i)];
  }
  const memo = new Map(), nxt = new Map();
  function solve(rem, buf){
    if (rem === full) return true;
    const key = rem * 65536 + buf; if (memo.has(key)) return memo.get(key);
    memo.set(key, false);
    for (let i = 0; i < n; i++) {
      if (((rem >> i) & 1) || blocked(i, rem)) continue;
      const nx = apply(rem, buf, i); if (!nx) continue;
      if (solve(nx[0], nx[1])) { memo.set(key, true); nxt.set(key, i); return true; }
    }
    return false;
  }
  if (!solve(rem0, buf0)) return null;
  const path = []; let rem = rem0, buf = buf0;
  while (rem !== full) { const i = nxt.get(rem * 65536 + buf); path.push(i); const nx = apply(rem, buf, i); rem = nx[0]; buf = nx[1]; }
  return path;
}
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* Luật hình học để màn nhìn gọn và chơi được: ốc nằm gọn trong thanh, không bị che lấp lửng, không sát nhau,
   mỗi thanh có >= 2 ốc giữ (khớp mô hình vật lý của bộ giải). Trả về danh sách lỗi (rỗng = tốt). */
function layoutIssues(L, skipHolders){
  const out = [], byId = {}; L.plates.forEach(p => byId[p.id] = p);

  L.screws.forEach((s, i) => {
    s.plateIds.forEach(id => { if (!inRect(grow(byId[id], -0.8), s.x, s.y)) out.push('margin' + i); });
    L.plates.forEach(q => {

  const sym = makeSymbol(colorKey, SYM_DARK, 1); sym.position.z = .215; g.add(sym);
  const hit = new THREE.Mesh(GEO.hit, HIT_MAT);  // vùng chạm rộng cho ngón tay
  hit.rotation.x = Math.PI/2; hit.position.z = .1; g.add(hit);
  return g;
}
/* vòng gợi ý (nhấp nháy quanh ốc nên tháo) */
const hintRing = new THREE.Mesh(new THREE.RingGeometry(.62, .8, 36), new THREE.MeshBasicMaterial({color:0x2d2a36, transparent:true, opacity:.9, depthTest:false}));
hintRing.renderOrder = 20; hintRing.visible = false; scene.add(hintRing);

/* =====================================================================
   4. TRẠNG THÁI TRÒ CHƠI
   ===================================================================== */
const MAX_SLOTS = 5, G_PEND = 20, G_FALL = 26;
const state = {kind:'level', dailyDate:'', stats:{hints:0, hammers:0, ads:0}, started:false, menuOpen:false, hammers:1, hammerArmed:false, mode:'play', level:0, loadId:0, openSlots:3, boxIdx:0, delivered:0, t:0, idle:0, L:null};
let world = null, plates = [], screws = [], boxes = [], slots = [], confetti = [], hintTarget = null, prefetched = null;
const QS = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
state.level = Save.d.frontier;
if (QS.has('start')) state.level = Math.max(0, parseInt(QS.get('start'), 10) || 0);

let toastTimer = 0;
function toast(msg, ms){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2200);
}
const TUTORIAL = {
  0:'Tap a screw to unscrew it. Same color as the box goes in!',
  1:'Other colors wait in the slots below. Don\'t let them fill up!',
  3:'Tough one! Plan your order before you tap.'
};

/* ---------- dựng màn chơi ---------- */
function loadLevel(i, daily, silent){
  state.loadId++; state.level = i; state.kind = daily ? 'daily' : 'level'; state.dailyDate = daily || ''; state.stats = {hints:0, hammers:0, ads:0}; state.mode = 'play'; state.hammers = 1; state.hammerArmed = false; state.openSlots = 3; state.boxIdx = 0; state.delivered = 0; state.idle = 0;
  if (world) { scene.remove(world); world.traverse(o => { if (o.geometry && o.userData.own) o.geometry.dispose(); }); confetti.forEach(c => c.m.material.dispose()); }
  world = new THREE.Group(); scene.add(world);
  plates = []; screws = []; boxes = []; slots = []; confetti = []; setHint(null);

  const L = daily ? makeDaily(daily) : ((prefetched && prefetched.n === i) ? prefetched.L : makeLevel(i)); prefetched = null; state.L = L;
  state.model = buildModel(L);       // dựng ngay khi thanh còn ở tư thế ban đầu (vật lý sẽ làm các thanh di chuyển)

  // tấm nền cố định (anchor plane)
  const board = new THREE.Mesh(new THREE.ShapeGeometry(roundedRectShape(11, 10.8, .6)), cmat(0xE9E1D6, 1)); board.userData.own = true;
  board.position.set(0, 0.4, BOARD_Z); board.receiveShadow = true; world.add(board);

  L.screws.forEach(s => {
    s.mesh = makeScrewMesh(s.color); s.mesh.userData.screw = s; s.removed = false; s.anim = null;
    s.mesh.position.set(s.x, s.y, s.layer*LAYER_DZ + PLATE_T);
    s.mesh.traverse(o => { if (o.isMesh && o.material !== HIT_MAT) o.castShadow = true; });
    world.add(s.mesh); screws.push(s);
  });
  L.plates.forEach(p => {
    p.holders = new Set(L.screws.filter(s => s.plateIds.includes(p.id)));
    p.state = 'fixed'; p.removed = false; p.shake = 0; p.z = p.layer*LAYER_DZ; p.ang0 = p.ang;
    p.k = (p.w*p.w + p.h*p.h) / 12;             // momen quán tính / khối lượng quanh tâm (cho con lắc)
    const c = Math.cos(-p.ang), sn = Math.sin(-p.ang);
    const holes = [...p.holders].map(s => ({x:(s.x - p.x)*c - (s.y - p.y)*sn, y:(s.x - p.x)*sn + (s.y - p.y)*c}));
    const mesh = new THREE.Mesh(slabGeometry(p.w, p.h, PLATE_T - .06, holes), PLATE_MAT[p.mat]);
    mesh.userData.own = true; mesh.castShadow = true; mesh.receiveShadow = true; mesh.position.z = .03;
    p.group = new THREE.Group(); p.group.add(mesh); world.add(p.group); plates.push(p);
    syncPlate(p);
  });
  buildTray(); buildBoxes(L.order);
  hideOverlay(); updateHud();
  if (!silent && !daily && i === Save.d.frontier && TUTORIAL[i]) toast(TUTORIAL[i], 4500); else $('toast').classList.remove('show');
}

/* ---------- khay chờ (buffer slots) ---------- */
function buildTray(){
  const tray = new THREE.Mesh(new THREE.ShapeGeometry(roundedRectShape(MAX_SLOTS*1.62 + .7, 2, .8)), cmat(0xE3D9CB, 1)); tray.userData.own = true;
  tray.position.set(0, -7.6, TRAY_Z - .1); tray.receiveShadow = true; world.add(tray);
  for (let i = 0; i < MAX_SLOTS; i++) {
    const pos = new THREE.Vector3((i - (MAX_SLOTS-1)/2)*1.62, -7.6, TRAY_Z + .1);
    const open = new THREE.Mesh(GEO.hole, HOLE_DARK); open.position.copy(pos);
    const lock = new THREE.Group(); lock.position.copy(pos);
    const disc = new THREE.Mesh(GEO.hole, LOCK_MAT); lock.add(disc);
    const bar = new THREE.Mesh(GEO.bar, WHITE_BASIC);
    bar.position.z = .02; lock.add(bar); const bar2 = bar.clone(); bar2.rotation.z = Math.PI/2; lock.add(bar2);
    const tap = new THREE.Mesh(GEO.tap, HIT_MAT);   // vùng chạm để mở khóa bằng quảng cáo
    tap.rotation.x = Math.PI/2; lock.add(tap); lock.userData.lock = true;
    world.add(open, lock);
    slots.push({pos, screw:null, open:false, ring:open, lock});
  }
  refreshSlots();
}
function slotOrder(){ return [2, 1, 3, 0, 4]; }       // lỗ mở dần từ giữa ra hai bên
function refreshSlots(){
  const order = slotOrder();
  slots.forEach(s => { s.open = false; });
  for (let k = 0; k < state.openSlots; k++) slots[order[k]].open = true;
  slots.forEach(s => { s.ring.visible = s.open; s.lock.visible = !s.open; });
}

/* ---------- hộp thu gom (collector boxes) ---------- */
const BOX_W = 4.6, BOX_H = 1.7, SOCK = [-1.5, 0, 1.5];
function buildBoxes(order){
  order.forEach(col => {
    const g = new THREE.Group(), body = new THREE.Mesh(slabGeometry(BOX_W, BOX_H, .5, []), cmat(COLORS[col], .7)); body.userData.own = true;
    g.add(body);   // hộp không đổ bóng lên bàn
    SOCK.forEach(x => { const d = new THREE.Mesh(GEO.sock, DARK); d.position.set(x, 0, .55); g.add(d); const s = makeSymbol(col, SYM_LIGHT, .8); s.position.set(x, 0, .56); g.add(s); });   // ký hiệu mờ trong mỗi lỗ hộp
    const lidGeo = slabGeometry(BOX_W, BOX_H, .16, []); lidGeo.translate(BOX_W/2, 0, 0);      // gốc ở mép trái để nắp trượt mở
    const lid = new THREE.Mesh(lidGeo, cmat(new THREE.Color(COLORS[col]).lerp(new THREE.Color(0xffffff), .35).getHex(), .6)); lid.userData.own = true;
    lid.position.set(-BOX_W/2, 0, .72); g.add(lid);
    const lidSym = makeSymbol(col, SYM_LIGHT, 2.2); lidSym.position.set(BOX_W/2, 0, .23); lid.add(lidSym);   // hộp đóng nắp vẫn hiện ký hiệu màu
    g.position.set(9, 7.7, TRAY_Z); world.add(g);
    boxes.push({color:col, group:g, lid, reserved:0, arrived:0, done:false, leaving:false, gone:false});
  });
}
const _tmp = new THREE.Vector3();
function boxTarget(box, i){      // vị trí thế giới của lỗ i trong hộp (hộp đang di chuyển nên tính lại mỗi khung)
  const g = box.group; return _tmp.set(g.position.x + SOCK[i]*g.scale.x, g.position.y, TRAY_Z + .9);
}
function updateBoxes(dt){
  const visible = boxes.filter(b => !b.gone && !b.leaving);
  boxes.forEach(b => {
    let tp, ts, lidOpen = false;
    if (b.gone) { b.group.visible = false; return; }
    if (b.leaving) { tp = [-9, 7.9]; ts = .5; }
    else {
      const idx = visible.indexOf(b);
      if (idx === 0) { tp = [0, 7.7]; ts = 1; }
      else if (idx === 1) { tp = [4.0, 7.9]; ts = .62; }     // hộp kế tiếp, đóng nắp, thu nhỏ (preview)
      else { tp = [9, 7.9]; ts = .5; }
      lidOpen = (b === boxes[state.boxIdx]) && !b.done;
    }
    b.group.visible = b.leaving || visible.indexOf(b) <= 1;      // chỉ hiện hộp hiện tại và hộp kế tiếp
    const k = 1 - Math.exp(-dt*9), g = b.group;
    g.position.x += (tp[0] - g.position.x)*k; g.position.y += (tp[1] - g.position.y)*k;
    g.scale.setScalar(g.scale.x + (ts - g.scale.x)*k);
    const ls = b.lid.scale.x + ((lidOpen ? 0.001 : 1) - b.lid.scale.x)*(1 - Math.exp(-dt*14)); b.lid.scale.x = ls; b.lid.visible = ls > 0.03;
  });
}
function completeBox(box){               // đủ 3 ốc: đóng nắp, pháo giấy, bay khỏi màn hình
  box.done = true; const token = state.loadId;
  setTimeout(() => { if (token !== state.loadId) return; sfx.ding(); spawnConfetti(box.group.position.x, box.group.position.y, 26); haptic(20); }, 320);
  setTimeout(() => { if (token !== state.loadId) return; box.leaving = true; }, 950);
  setTimeout(() => { if (token !== state.loadId) return; box.gone = true; }, 1600);
}
const CONFETTI_GEO = new THREE.BoxGeometry(.22, .12, .02);
function spawnConfetti(x, y, count){
  const cols = [0xFF5E57, 0x3867D6, 0xFFA801, 0x05C46B, 0x8854D0];
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(CONFETTI_GEO, new THREE.MeshBasicMaterial({color:cols[i % cols.length], transparent:true}));
    m.position.set(x, y, 1.2); world.add(m);
    confetti.push({m, vx:(Math.random() - .5)*9, vy:Math.random()*7 + 2, vz:Math.random()*3, vr:(Math.random() - .5)*14, life:1.3});
  }
}

/* =====================================================================
   5. LOGIC THANH CHẮN (Plate State)
   fixed    : còn >= 2 ốc giữ  -> đứng yên
   pendulum : còn đúng 1 ốc    -> xoay tự do quanh con ốc đó như con lắc vật lý
   falling  : hết ốc           -> rơi tự do theo trọng lực, bị hủy khi Y < -16
   ===================================================================== */
function updatePlateState(p){
  if (p.removed || p.state === 'falling') return;
  const n = p.holders.size;
  if (n >= 2) { p.state = 'fixed'; return; }
  if (n === 1) {
    const s = [...p.holders][0];
    if (p.state === 'pendulum' && p.pivot === s) return;
    p.pivot = s;
    const dx = s.x - p.x, dy = s.y - p.y, c = Math.cos(-p.ang), sn = Math.sin(-p.ang);
    p.r = {x:dx*c - dy*sn, y:dx*sn + dy*c};      // vị trí ốc trong hệ tọa độ của thanh
    p.state = 'pendulum'; p.om = 0; return;
  }
  p.state = 'falling'; p.vx = (Math.random() - .5)*1.4; p.vy = 0; p.om = (Math.random() - .5)*2.6;
  sfx.whoosh();
}
function stepPlates(h){
  for (const p of plates) {
    if (p.removed) continue;
    if (p.state === 'pendulum') {
      // gia tốc góc của vật rắn treo ở 1 điểm: alpha = g*(Px-Cx) / (k + d^2)
      let c = Math.cos(p.ang), sn = Math.sin(p.ang);
      const rx = c*p.r.x - sn*p.r.y;
      const a = G_PEND*rx / (p.k + p.r.x*p.r.x + p.r.y*p.r.y);
      p.om += a*h; p.om *= Math.exp(-2.6*h); p.ang += p.om*h;
      const dl = p.ang - p.ang0;                       // bị chặn ở góc giới hạn (va chạm mất hết động năng)
      if (dl > SWING_LIMIT) { p.ang = p.ang0 + SWING_LIMIT; if (p.om > 0) p.om = 0; }
      else if (dl < -SWING_LIMIT) { p.ang = p.ang0 - SWING_LIMIT; if (p.om < 0) p.om = 0; }
      c = Math.cos(p.ang); sn = Math.sin(p.ang);
      p.x = p.pivot.x - (c*p.r.x - sn*p.r.y); p.y = p.pivot.y - (sn*p.r.x + c*p.r.y);
    } else if (p.state === 'falling') {
      p.vy -= G_FALL*h; p.x += p.vx*h; p.y += p.vy*h; p.ang += p.om*h; p.z += h*1.5;
      if (p.y < -16) { p.removed = true; world.remove(p.group); }
    }
  }
}
function syncPlate(p, dt){
  if (p.shake > 0) p.shake = Math.max(0, p.shake - (dt || 0));
  const sx = p.shake > 0 ? Math.sin(state.t*70)*0.09*(p.shake/.3) : 0;
  p.group.position.set(p.x + sx, p.y, p.z); p.group.rotation.z = p.ang;
}
/* Ốc bị chặn khi có thanh nằm TẦNG CAO HƠN che đúng vị trí của nó (thanh đang rơi không còn che) */
function blockerOf(s){
  for (const p of plates) {
    if (p.removed || p.state === 'falling' || p.layer <= s.layer) continue;
    if (inRect(p, s.x, s.y)) return p;
  }
  return null;
}

/* =====================================================================
   6. TƯƠNG TÁC: Raycaster, rút ốc, bay vào hộp / lỗ chờ
   ===================================================================== */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('pointerdown', e => {
  audio(); state.idle = 0;
  if (state.mode !== 'play') return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(screws.filter(s => !s.removed).map(s => s.mesh), true);
  if (state.hammerArmed) {                          // Búa: tháo BẤT KỲ ốc nào, kể cả ốc đang bị thanh đè. Chọn ốc có tâm gần tia chạm nhất.
    let best = null, bd = .8;
    for (const s of screws) { if (s.removed) continue; const d = raycaster.ray.distanceToPoint(s.mesh.position); if (d < bd) { bd = d; best = s; } }
    if (best) { state.hammerArmed = false; sfx.click(); haptic(30); pullScrew(best); return; }
    toast('Tap on a screw to smash it'); return;
  }
  let blocked = null;
  for (const h of hits) {                          // lấy ốc gần nhất mà KHÔNG bị thanh đè
    let o = h.object; while (o && !o.userData.screw) o = o.parent;
    if (!o) continue;
    const b = blockerOf(o.userData.screw);
    if (b) { blocked = blocked || b; continue; }
    pullScrew(o.userData.screw); return;
  }
  if (blocked) { blocked.shake = .3; sfx.buzz(); haptic(25); toast('That screw is covered by a plate'); return; }
  const lh = raycaster.intersectObjects(slots.filter(s => !s.open).map(s => s.lock), true);   // chạm lỗ bị khóa -> mở bằng Ad
  if (lh.length && state.openSlots < MAX_SLOTS) watchAd(addHole);
});

function detachScrew(s){                 // ốc rời khỏi mọi thanh nó đang giữ -> cập nhật trạng thái các thanh đó
  s.removed = true;
  for (const p of plates) if (p.holders.delete(s)) updatePlateState(p);
}
function freeSlot(){
  for (const i of slotOrder()) { const s = slots[i]; if (s.open && !s.screw) return s; }
  return null;
}
function pullScrew(s){
  const box = boxes[state.boxIdx];
  setHint(null);
  if (box && box.reserved < 3 && s.color === box.color) {
    const i = box.reserved++;
    detachScrew(s); sendToBox(s, box, i, false);
    if (box.reserved === 3) { state.boxIdx++; flushBuffer(); }
  } else {
    const slot = freeSlot();
    if (!slot) { sfx.buzz(); toast('Slots are full! Only take screws that match the box'); return; }
    detachScrew(s); slot.screw = s;
    flyTo(s, () => slot.pos, () => { s.mesh.position.copy(slot.pos); s.mesh.scale.setScalar(1); sfx.clack(); }, false, false);
    if (!freeSlot()) toast('Slots full! Match the box color');
  }
  sfx.click(); haptic(10);
  updateHud(); evaluate();
}
function sendToBox(s, box, i, skipLift){
  flyTo(s, () => boxTarget(box, i), () => {
    box.group.add(s.mesh); s.mesh.position.set(SOCK[i], 0, .6); s.mesh.scale.setScalar(.85); s.mesh.rotation.set(0, 0, 0);
    box.arrived++; state.delivered++; sfx.clack();
    if (box.arrived === 3) completeBox(box);
    if (state.delivered === screws.length) onWin();
  }, skipLift, true);
}
/* Khi hộp mới mở, ốc cùng màu đang nằm ở lỗ chờ tự bay vào hộp */
function flushBuffer(){
  let changed = true;
  while (changed) {
    changed = false;
    const box = boxes[state.boxIdx]; if (!box) break;
    for (const sl of slots) {
      if (sl.screw && sl.screw.color === box.color && box.reserved < 3) {
        const s = sl.screw; sl.screw = null; const i = box.reserved++;
        sendToBox(s, box, i, true); changed = true;
        if (box.reserved === 3) state.boxIdx++;
      }
    }
  }
}
/* Bay theo đường cong Bezier bậc 2; giai đoạn 'lift' xoay ngược chiều kim đồng hồ 720° và nâng lên 0.15s */
function flyTo(s, targetFn, onArrive, skipLift, shrink){
  const m = s.mesh;
  s.anim = {phase:skipLift ? 'fly' : 'lift', t:0, base:m.position.z, rot0:m.rotation.z, target:targetFn, onArrive, shrink, from:new THREE.Vector3(), ctrl:new THREE.Vector3(), dur:.5};
  if (skipLift) beginFly(s);
}
function beginFly(s){
  const a = s.anim, to = a.target();
  a.phase = 'fly'; a.t = 0; a.from.copy(s.mesh.position);
  a.ctrl.copy(a.from).lerp(to, .5); a.ctrl.z += 3.5; a.ctrl.x += (to.x - a.from.x)*.1;
  a.dur = Math.min(.7, .38 + a.from.distanceTo(to)*.025);
}
const _q = new THREE.Vector3();
function updateScrews(dt){
  for (const s of screws) {
    const a = s.anim; if (!a) continue;
    a.t += dt;
    if (a.phase === 'lift') {
      const e = 1 - Math.pow(1 - Math.min(a.t/.15, 1), 3);
      s.mesh.rotation.z = a.rot0 + Math.PI*4*e; s.mesh.position.z = a.base + 1.4*e;
      if (a.t >= .15) beginFly(s);
    } else {
      const u = Math.min(a.t/a.dur, 1), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2, to = a.target();
      _q.copy(a.from).multiplyScalar((1 - e)*(1 - e)).addScaledVector(a.ctrl, 2*(1 - e)*e).addScaledVector(to, e*e);
      s.mesh.position.copy(_q); s.mesh.rotation.z += dt*10*(1 - u);
      if (a.shrink) s.mesh.scale.setScalar(1 - .15*e);
      if (u >= 1) { const cb = a.onArrive; s.anim = null; cb(); }
    }
  }
}

/* =====================================================================
   7. GỢI Ý, THẮNG / THUA, QUẢNG CÁO GIẢ LẬP, HUD
   ===================================================================== */
function setHint(s){ hintTarget = s; hintRing.visible = !!s; }
function computeHint(){                  // nước đi tiếp theo theo bộ giải (từ trạng thái hiện tại)
  let rem = 0, buf = 0;
  screws.forEach((s, i) => { if (s.removed) rem |= 1 << i; });
  slots.forEach(sl => { if (sl.screw) buf |= 1 << sl.screw.idx; });
  const path = solvePath(state.L, state.openSlots, rem, buf, state.model);
  if (path && path.length) return screws[path[0]];
  const box = boxes[state.boxIdx];
  return box ? (screws.find(s => !s.removed && s.color === box.color && !blockerOf(s)) || null) : null;
}
function armHammer(){
  if (state.mode !== 'play') return;
  if (state.hammerArmed) { state.hammerArmed = false; updateHud(); toast('Hammer put away'); return; }
  const arm = () => { state.hammerArmed = true; state.stats.hammers++; updateHud(); if (!Guide.tip('hammer')) toast('Hammer ready: tap ANY screw, even covered ones', 3500); };
  if (state.hammers > 0) { state.hammers--; arm(); }                                   // 1 bua mien phi moi man
  else if (Save.d.bonusHammers > 0) { Save.d.bonusHammers--; Save.save(); arm(); }     // bua thuong tu chuoi thang / thu thach ngay
  else watchAd(() => { state.stats.ads++; arm(); });                                   // het bua: xem quang cao
}
function showHint(){
  if (state.mode !== 'play') return;
  const s = computeHint();
  if (s) { setHint(s); state.stats.hints++; if (!Guide.tip('hint')) toast('Try this screw'); }
  else toast('No safe move left. Try adding a slot!');
}
function isStuck(){        // thua: lỗ chờ đã đầy và không còn ốc đúng màu hộp hiện tại nào lấy được (tính theo tư thế cuối của thanh,
                           // để thanh đang đung đưa tạm thời che ốc không gây thua oan)
  const left = screws.filter(s => !s.removed);
  if (!left.length) return false;
  if (slots.some(s => s.open && !s.screw)) return false;
  const box = boxes[state.boxIdx]; if (!box) return false;
  let rem = 0; screws.forEach((s, i) => { if (s.removed) rem |= 1 << i; });
  return !left.some(s => s.color === box.color && !state.model.blocked(s.idx, rem));
}
function evaluate(){
  if (state.mode !== 'play') return;
  const token = state.loadId;
  setTimeout(() => { if (token === state.loadId && state.mode === 'play' && isStuck()) onLose(); }, 700);
}
/* Sao: 3 = khong dung tro giup nao (Hint, Hammer), 2 = mot tro giup, 1 = nhieu tro giup hoac co xem quang cao */
function starsFor(){ const s = state.stats, helps = s.hints + s.hammers + s.ads; return (s.ads > 0 || helps >= 2) ? 1 : (helps === 1 ? 2 : 3); }
function restartCurrent(){ if (state.kind === 'daily') loadLevel(0, state.dailyDate); else loadLevel(state.level); }
function onWin(){
  if (state.mode !== 'play') return;
  state.mode = 'won'; const token = state.loadId; setHint(null);
  const sv = Save.d, st = starsFor(), lines = [], daily = state.kind === 'daily';
  if (daily) {
    const date = state.dailyDate, first = sv.dailyDone[date] == null;
    sv.dailyDone[date] = Math.max(sv.dailyDone[date] || 0, st);
    if (first) {
      sv.dailyStreak = (sv.lastDaily === prevDay(date)) ? sv.dailyStreak + 1 : 1; sv.lastDaily = date; sv.bonusHammers++;
      lines.push('📅 Daily complete! 🎁 +1 Hammer', '📆 Daily streak: ' + sv.dailyStreak + (sv.dailyStreak === 1 ? ' day' : ' days'));
    } else lines.push('Already completed today · best ' + '★'.repeat(sv.dailyDone[date]));
  } else {
    const i = state.level; sv.stars[i] = Math.max(sv.stars[i] || 0, st);
    if (i === sv.frontier) {                       // chi man moi (chua qua) moi tinh chuoi thang, choi lai man cu khong tinh
      sv.frontier++; sv.streak++; sv.bestStreak = Math.max(sv.bestStreak, sv.streak);
      lines.push('🔥 Win streak: ' + sv.streak);
      if (sv.streak % 3 === 0) { sv.bonusHammers++; lines.push('🎁 3-win streak bonus: +1 Hammer!'); }
    } else lines.push('Replay · best ' + '★'.repeat(sv.stars[i]));
  }
  Save.save(); updateHud();
  setTimeout(() => {
    if (token !== state.loadId) return;
    sfx.win(); haptic([30, 40, 30]);
    if (!daily) setTimeout(() => { if (token === state.loadId && !prefetched) prefetched = {n:state.level + 1, L:makeLevel(state.level + 1)}; }, 80);   // tinh truoc man ke tiep khi bang thang dang hien
    spawnConfetti(-3, 5, 30); spawnConfetti(3, 5, 30);
    const extra = '<div class="winstars">' + starsHtml(st, true) + '</div><div class="winlines">' + lines.map(l => '<div>' + l + '</div>').join('') + '</div>';
    const btns = [];
    if (!daily) btns.push(['Next Level ▶', 'btn', () => startLevel(Math.min(state.level + 1, sv.frontier))]);
    if (st < 3) btns.push(['★ Replay for 3 stars', 'btn amber', () => restartCurrent()]);
    btns.push(['Menu', 'btn grey', () => { hideOverlay(); openMenu(); }]);
    showOverlay(daily ? 'Daily Complete!' : 'Level Complete!', daily ? state.dailyDate : 'Level ' + (state.level + 1) + ' cleared. Nice!', btns, extra);
  }, 900);
}
function onLose(){
  state.mode = 'lost'; setHint(null); state.hammerArmed = false; sfx.buzz();
  const sv = Save.d, atRisk = state.kind === 'level' && state.level === sv.frontier && sv.streak > 0, btns = [];
  if (state.openSlots < MAX_SLOTS) btns.push(['▶ Watch Ad: +1 Slot', 'btn', () => watchAd(addHole)]);
  btns.push(['Try Again', 'btn red', () => { if (atRisk) resetStreak(); restartCurrent(); }]);
  btns.push(['Menu', 'btn grey', () => { if (atRisk) resetStreak(); hideOverlay(); openMenu(); }]);
  showOverlay('Out of space!', 'All slots are full and no screw matches the box.' + (atRisk ? ' Your 🔥 ' + sv.streak + ' streak is at risk. Keep it alive with an extra slot!' : ''), btns);
  updateHud();
}
function addHole(){
  if (state.openSlots >= MAX_SLOTS) return;
  state.stats.ads++;
  state.openSlots++; refreshSlots(); updateHud(); toast('+1 slot unlocked!');
}
/* ---------- QUẢNG CÁO THƯỞNG ----------
   Ads.showRewarded(onReward, onFail) là điểm duy nhất game gọi quảng cáo. Có 2 nhà cung cấp:
   - 'demo'  : đếm ngược 3 giây rồi cộng thưởng (dùng cho bản web / lúc phát triển).
   - 'admob' : khi chạy trong app Capacitor có plugin @capacitor-community/admob. ID bên dưới là ID QUẢNG CÁO THỬ của Google;
               khi phát hành phải thay bằng ID thật trong AdMob (xem STORE-COMPLIANCE.md). Phần này CHƯA được thử trên thiết bị thật. */
const AD_CONFIG = {rewardedAndroid:'ca-app-pub-3940256099942544/5224354917', rewardedIos:'ca-app-pub-3940256099942544/1712485313'};
const Ads = {
  get provider(){ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) ? 'admob' : 'demo'; },
  async showRewarded(onReward, onFail){
    if (Ads.provider === 'admob') {
      try {
        const AdMob = window.Capacitor.Plugins.AdMob, ios = window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios';
        if (!Ads.ready) { await AdMob.initialize({}); Ads.ready = true; }
        await AdMob.prepareRewardVideoAd({adId: ios ? AD_CONFIG.rewardedIos : AD_CONFIG.rewardedAndroid});
        const reward = await AdMob.showRewardVideoAd();
        if (reward) onReward(); else onFail && onFail();
      } catch (e) { onFail && onFail(e); }
      return;
    }
    const token = state.loadId; let n = 3; state.mode = 'ad'; updateHud();
    const tick = () => {
      if (token !== state.loadId) return;
      if (n === 0) { hideOverlay(); onReward(); return; }
      showOverlay('Rewarded ad (demo)', 'Reward in ' + n + '…', []); n--; setTimeout(tick, 1000);
    };
    tick();
  }
};
function watchAd(reward){
  if (state.mode === 'ad') return;
  const token = state.loadId, back = () => { if (token === state.loadId) { hideOverlay(); state.mode = 'play'; updateHud(); evaluate(); } };
  state.mode = 'ad'; updateHud();
  Ads.showRewarded(() => { if (token !== state.loadId) return; hideOverlay(); state.mode = 'play'; reward(); updateHud(); evaluate(); },
                   () => { toast('Ad not available right now. Try again later.'); back(); });
}
function showOverlay(title, text, btns, extra){
  $('ovTitle').textContent = title; $('ovText').textContent = text; $('ovExtra').innerHTML = extra || '';
  const box = $('ovBtns'); box.innerHTML = '';
  btns.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = cls; b.textContent = label; b.onclick = fn; box.appendChild(b); });
  $('overlay').classList.add('show');
}
function hideOverlay(){ $('overlay').classList.remove('show'); }
function updateHud(){
  const left = screws.filter(s => !s.removed).length;
  const daily = state.kind === 'daily';
  $('level').textContent = daily ? 'DAILY' : 'LEVEL ' + String(state.level + 1).padStart(2, '0');
  $('sub').textContent = (daily ? state.dailyDate + ' · ' : '') + left + (left === 1 ? ' screw left' : ' screws left') + (!daily && Save.d.streak > 0 ? ' · 🔥' + Save.d.streak : '');
  $('holes').textContent = 'Slots ' + state.openSlots + '/' + MAX_SLOTS;
  const play = state.mode === 'play';
  $('addHole').disabled = !play || state.openSlots >= MAX_SLOTS;
  $('hintBtn').disabled = !play;
  $('hammerBtn').disabled = !play;
  $('hammerBtn').classList.toggle('armed', state.hammerArmed);
  const hm = state.hammers + Save.d.bonusHammers; $('hammerBadge').textContent = hm > 0 ? String(hm) : 'Ad';
}
$('addHole').onclick = () => { if (state.mode === 'play' && state.openSlots < MAX_SLOTS) watchAd(addHole); };
$('hintBtn').onclick = showHint;
$('hammerBtn').onclick = armHammer;
$('replay').onclick = () => {      // choi lai: neu da thao oc o man moi dang choi thi chuoi thang bi ngat
  if (state.mode === 'ad') return;
  if (state.mode === 'play' && state.kind === 'level' && state.level === Save.d.frontier && screws.some(s => s.removed)) resetStreak();
  restartCurrent();
};
$('menuBtn').onclick = () => { if (state.mode !== 'ad') openMenu(); };

/* =====================================================================
   7b. MENU CHINH, DANH SACH MAN, THU THACH HANG NGAY, HUONG DAN
   HUONG DAN TU MO RONG: khi them tinh nang moi chi can them 1 muc vao GUIDE ben duoi. Muc do tu xuat hien trong
   "How to Play" kem nhan NEW, va nguoi choi cu se thay ghi chu "New:" o menu cho toi khi ho mo huong dan.
   ===================================================================== */
const GUIDE = [
  {id:'basics', group:'Basics', icon:'👆', title:'Unscrew', text:'Tap a screw to unscrew it. Screws hidden under a plate can\'t be reached until the plate above is gone.'},
  {id:'match', group:'Basics', icon:'📦', title:'Fill the boxes', text:'A screw that matches the top box flies in. Other colors wait in the slots below. 3 screws fill a box and open the next one.'},
  {id:'jam', group:'Basics', icon:'🚫', title:'Don\'t get jammed', text:'If every slot is full and no free screw matches the box, you\'re jammed. Plan your order!'},
  {id:'plates', group:'Basics', icon:'⬇️', title:'Falling plates', text:'Take a plate\'s last screw and it falls. With one screw left it swings and can cover other screws.'},
  {id:'colors', group:'Basics', icon:'🎨', title:'Colors and shapes', text:'Every color has its own shape too (+ − ▲ ● ◆), so you never need to rely on color alone.'},
  {id:'hint', group:'Tools', icon:'💡', title:'Hint', text:'Shows a safe screw to tap next. Counts as one help.'},
  {id:'hammer', group:'Tools', icon:'🔨', title:'Hammer', text:'Smash ANY screw, even a covered one. One free hammer per level, then watch an ad. Counts as one help.'},
  {id:'slot', group:'Tools', icon:'➕', title:'Extra slot', text:'Watch an ad to unlock one more waiting slot (up to 5). Counts as a help.'},
  {id:'stars', group:'Progress', icon:'⭐', title:'Stars', text:'3 stars = no help used, 2 = one help, 1 = more helps or an ad. Open Levels to replay any level and earn more stars.'},
  {id:'streak', group:'Progress', icon:'🔥', title:'Win streak', text:'Win new levels in a row. Every 3 wins gives +1 Hammer. A loss, or restarting after you\'ve started, breaks the streak. Replaying old levels doesn\'t count.'},
  {id:'daily', group:'Progress', icon:'📅', title:'Daily Challenge', text:'A new hard puzzle every day. Win it for +1 Hammer and to grow your daily streak (play on consecutive days).'}
];
const Guide = {
  unseen(){ const seen = Save.d.guideSeen || []; return GUIDE.filter(g => !seen.includes(g.id)); },
  markAllSeen(){ Save.d.guideSeen = GUIDE.map(g => g.id); Save.save(); },
  tip(id){ if (Save.d.tips[id]) return false; Save.d.tips[id] = 1; Save.save(); const g = GUIDE.find(x => x.id === id); if (!g) return false; toast(g.icon + ' ' + g.title + ': ' + g.text, 5500); return true; }
};
function pad2(n){ return String(n).padStart(2, '0'); }
function todayStr(){ if (QS.get('day')) return QS.get('day'); const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function prevDay(s){ const [y, m, d] = s.split('-').map(Number), t = new Date(Date.UTC(y, m - 1, d - 1)); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); }
const starsHtml = (n, big) => '<span class="stars' + (big ? ' big' : '') + '">' + [1, 2, 3].map(k => k <= n ? '★' : '☆').join('') + '</span>';
const totalStars = () => Object.values(Save.d.stars).reduce((a, b) => a + b, 0);
function resetStreak(){ if (Save.d.streak > 0) { Save.d.streak = 0; Save.save(); } }
const screenEl = $('screen');
function setScreen(html, handlers){
  screenEl.innerHTML = '<div class="panel">' + html + '</div>'; screenEl.classList.add('show'); screenEl.scrollTop = 0;
  for (const sel in handlers) { const el = screenEl.querySelector(sel); if (el) el.onclick = handlers[sel]; }
}
function hideScreen(){ screenEl.classList.remove('show'); state.menuOpen = false; }
function startLevel(i){ state.started = true; hideScreen(); hideOverlay(); loadLevel(i); }
function startDaily(){ state.started = true; hideScreen(); hideOverlay(); loadLevel(0, todayStr()); }
function openMenu(){
  state.menuOpen = true; const sv = Save.d, today = todayStr(), doneToday = sv.dailyDone[today] != null;
  const fresh = Guide.unseen(), dot = fresh.length ? '<span class="dot"></span>' : '';
  const note = (sv.guideSeen !== null && fresh.length) ? '<div class="note">🆕 <b>New:</b> ' + fresh.map(g => g.icon + ' ' + g.title).join(', ') + '<button id="mSee" class="btn amber" style="margin-top:8px;padding:8px">See what\'s new</button></div>' : '';
  setScreen(
    '<img class="logo" src="icons/icon-192.png" alt=""><h1>Screw Jam 3D</h1><div class="tag">Nuts &amp; Bolts</div>' + note +
    '<div class="chips"><span class="chip">🔥 Streak ' + sv.streak + '</span><span class="chip">⭐ ' + totalStars() + '</span>' + (sv.dailyStreak ? '<span class="chip">📅 ' + sv.dailyStreak + '-day</span>' : '') + '</div>' +
    (state.started ? '<button id="mResume" class="btn grey">↩ Resume</button>' : '') +
    '<button id="mPlay" class="btn big">▶ Play · Level ' + (sv.frontier + 1) + '</button>' +
    '<button id="mDaily" class="btn hammer">📅 Daily Challenge ' + (doneToday ? '· ✓ ' + starsHtml(sv.dailyDone[today]) : '· NEW') + '</button>' +
    '<div class="row"><button id="mLevels" class="btn amber">⭐ Levels</button><button id="mGuide" class="btn grey">📖 How to Play' + dot + '</button></div>' +
    '<button id="mSound" class="btn grey">' + (muted ? '🔇 Sound: Off' : '🔊 Sound: On') + '</button>',
    {'#mResume': hideScreen, '#mPlay': () => startLevel(sv.frontier), '#mDaily': startDaily, '#mLevels': openLevels, '#mGuide': openGuide, '#mSee': openGuide,
     '#mSound': () => { muted = !muted; Save.d.muted = muted; Save.save(); audio(); openMenu(); }});
}
function openLevels(){
  const sv = Save.d; let cells = '';
  for (let i = 0; i <= sv.frontier; i++) cells += '<button class="lv' + (i === sv.frontier ? ' new' : '') + '" data-i="' + i + '">' + (i + 1) + '<small>' + (i === sv.frontier ? 'NEW' : starsHtml(sv.stars[i] || 1)) + '</small></button>';
  setScreen('<h2>Levels</h2><p class="subtle">Tap a level to play it again and earn more stars. 3 stars = no help used.</p><div class="lvgrid">' + cells + '</div><button id="lBack" class="btn grey">Back</button>', {'#lBack': openMenu});
  screenEl.querySelectorAll('.lv').forEach(b => { b.onclick = () => startLevel(+b.dataset.i); });
  const cur = screenEl.querySelector('.lv.new'); if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'center'});
}
function openGuide(){
  const unseen = new Set(Guide.unseen().map(g => g.id)); let html = '<h2>How to Play</h2>', grp = '';
  GUIDE.forEach(g => {
    if (g.group !== grp) { grp = g.group; html += '<div class="ghead">' + grp.toUpperCase() + '</div>'; }
    html += '<div class="gcard"><b>' + g.icon + ' ' + g.title + '</b>' + (unseen.has(g.id) ? '<span class="new-badge">NEW</span>' : '') + '<p>' + g.text + '</p></div>';
  });
  setScreen(html + '<button id="gBack" class="btn">Back</button>', {'#gBack': openMenu});
  Guide.markAllSeen();
}

/* =====================================================================
   8. VÒNG LẶP TRÒ CHƠI
   ===================================================================== */
let last = performance.now();
function frame(now){
  const dt = Math.min(Math.max((now - last)/1000, 0), 1/20); last = now; state.t += dt;
  const steps = Math.max(1, Math.ceil(dt/(1/120)));          // bước vật lý nhỏ để con lắc ổn định
  for (let i = 0; i < steps; i++) stepPlates(dt/steps);
  plates.forEach(p => { if (!p.removed) syncPlate(p, dt); });
  updateScrews(dt); updateBoxes(dt);
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i]; c.life -= dt; c.vy -= 16*dt;
    c.m.position.x += c.vx*dt; c.m.position.y += c.vy*dt; c.m.position.z += c.vz*dt; c.m.rotation.z += c.vr*dt; c.m.rotation.x += c.vr*dt;
    c.m.material.opacity = Math.max(0, Math.min(1, c.life*2));
    if (c.life <= 0) { world.remove(c.m); c.m.material.dispose(); confetti.splice(i, 1); }
  }
  // gợi ý tự động ở 2 màn đầu nếu người chơi đứng yên 7 giây
  if (state.mode === 'play') { state.idle += dt; if (state.level < 2 && state.idle > 7 && !hintTarget) { const s = computeHint(); if (s) setHint(s); } }
  if (hintTarget && !hintTarget.removed) {
    const m = hintTarget.mesh; hintRing.position.set(m.position.x, m.position.y, m.position.z + .5);
    hintRing.scale.setScalar(1 + .16*Math.sin(state.t*8)); hintRing.visible = true;
  } else if (hintTarget) setHint(null);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =====================================================================
   9. CHẾ ĐỘ TỰ KIỂM TRA (?auto=<số màn>&start=<màn bắt đầu>&stop=<số nước>): tự chơi theo lời giải
      bằng sự kiện chạm thật (raycaster) để kiểm tra toàn bộ vòng lặp. Không ảnh hưởng người chơi thường.
   ===================================================================== */
function clickScrew(s){
  const v = new THREE.Vector3(); s.mesh.getWorldPosition(v); v.project(camera);
  const r = canvas.getBoundingClientRect();
  canvas.dispatchEvent(new PointerEvent('pointerdown', {clientX:r.left + (v.x*.5 + .5)*r.width, clientY:r.top + (-v.y*.5 + .5)*r.height, bubbles:true}));
}
async function runAuto(){
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const start = state.level, count = +QS.get('auto') || 1, stop = +QS.get('stop') || 0, out = [];
  const log = () => {
    let el = $('autoresult');
    if (!el) { el = document.createElement('pre'); el.id = 'autoresult'; el.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none'; document.body.appendChild(el); }
    el.textContent = JSON.stringify(out); document.title = 'AUTO ' + JSON.stringify(out);
  };
  for (let lv = start; lv < start + count; lv++) {
    loadLevel(lv); await sleep(300);
    const path = solvePath(state.L, 3, 0, 0, state.model), rec = {level:lv + 1, screws:screws.length, moves:path ? path.length : null, result:'?'};
    out.push(rec); log();
    if (!path) { rec.result = 'NO_PATH'; continue; }
    let mv = 0;
    for (const idx of path) {
      const s = screws[idx]; let w = 0;
      while (blockerOf(s) && w < 60) { await sleep(100); w++; }
      if (blockerOf(s)) { rec.result = 'BLOCKED@' + mv; break; }
      clickScrew(s); mv++;
      if (stop && mv >= stop) { rec.result = 'STOPPED'; log(); return; }
      await sleep(380);
      if (state.mode === 'lost') {
        rec.result = 'LOST@' + mv;
        rec.dbg = {box:boxes[state.boxIdx] && boxes[state.boxIdx].color, slots:slots.map(sl => sl.open ? (sl.screw ? sl.screw.color + sl.screw.idx : '-') : 'x'),
          path:path.join(','), left:screws.filter(s => !s.removed).map(s => s.idx + s.color + (blockerOf(s) ? '^' + blockerOf(s).id : '')),
          plates:plates.map(p => p.id + ':' + p.state + (p.removed ? '(gone)' : ''))};
        break;
      }
    }
    if (rec.result === '?') { let w = 0; while (state.mode === 'play' && w < 80) { await sleep(100); w++; } rec.result = state.mode === 'won' ? 'WON' : state.mode.toUpperCase(); }
    rec.ms = Math.round(state.t*1000); log();
  }
  log();
}

const direct = QS.has('auto') || (QS.has('debug') && !QS.has('menu'));      // cong cu kiem thu vao thang man choi; nguoi choi thuong vao menu chinh
loadLevel(state.level, undefined, !direct);          // dung san man nen (khong hien goi y khi dang o menu)
requestAnimationFrame(frame);
if (direct) state.started = true; else openMenu();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !QS.has('auto') && !QS.has('debug')) navigator.serviceWorker.register('sw.js').catch(() => {});   // cài lên màn hình chính + chơi offline
if (QS.has('auto')) runAuto();
if (QS.has('auto') || QS.has('debug')) window.__sj = {Save, Guide, GUIDE, openMenu, openLevels, openGuide, startLevel, startDaily, todayStr, starsFor, makeDaily, resetStreak, restartCurrent, state, loadLevel, makeLevel, solvePath, pullScrew, showHint, watchAd, addHole, blockerOf, armHammer, clickScrew, get hintVisible(){ return hintRing.visible; }, get info(){ return renderer.info.memory; }, get slots(){ return slots; }, get boxes(){ return boxes; }, get screws(){ return screws; }, get plates(){ return plates; }};

})();
